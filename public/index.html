<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Moja Gra</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f1220; font-family: system-ui, sans-serif; color: #fff; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(15,18,32,.85); }
  .overlay.hidden { display: none; }
  h1 { margin: 0; font-size: 42px; }
  input, button { font-size: 18px; padding: 12px 18px; border-radius: 10px; border: 0; }
  input { width: 240px; text-align: center; }
  button { background: #4f8cff; color: #fff; cursor: pointer; font-weight: 600; }
  #hud { position: fixed; top: 10px; right: 12px; background: rgba(0,0,0,.35); padding: 10px 14px; border-radius: 10px; font-size: 14px; min-width: 160px; }
  #hud h3 { margin: 0 0 6px; font-size: 13px; opacity: .7; }
  #score { position: fixed; top: 10px; left: 12px; font-size: 18px; background: rgba(0,0,0,.35); padding: 8px 14px; border-radius: 10px; }
  p.hint { opacity: .6; margin: 0; font-size: 14px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="score">Wynik: 0</div>
<div id="hud"><h3>TOP 5</h3><div id="board"></div></div>

<div id="menu" class="overlay">
  <h1>Moja Gra</h1>
  <input id="name" maxlength="14" placeholder="Twój nick" autofocus>
  <button id="play">Graj</button>
  <p class="hint">Steruj myszką lub palcem. Zjadaj kulki i mniejszych graczy.</p>
</div>
<div id="dead" class="overlay hidden">
  <h1>Zostałeś zjedzony!</h1>
  <p id="deadInfo"></p>
  <button id="again">Graj ponownie</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>
</body>
</html>
