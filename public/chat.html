<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHAT CONTROLS — Neon Ascent</title>
<style>
body.noweb .vrow{cursor:default}body.noweb .vrow:hover .k{color:#00e5ff}

*{box-sizing:border-box}html,body{margin:0;height:100%;background:#05040c;overflow:hidden;font-family:'Segoe UI',Consolas,monospace;color:#cfeaff}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.neon{text-shadow:0 0 6px currentColor,0 0 18px currentColor}
.panel{position:fixed;background:rgba(8,6,22,.62);border:1px solid rgba(0,229,255,.35);box-shadow:0 0 18px rgba(0,229,255,.18) inset,0 0 18px rgba(255,43,214,.12);backdrop-filter:blur(3px);padding:10px 14px;border-radius:4px}
#title{left:16px;top:14px;min-width:290px}
#title h1{margin:0;font-size:22px;letter-spacing:4px;color:#00e5ff}
#title .sub{color:#ff2bd6;font-size:12px;letter-spacing:2px;margin-top:2px}
#zone{margin-top:8px;font-size:15px;letter-spacing:2px}
.bar{height:8px;background:#12102a;margin-top:6px;border:1px solid #243;position:relative;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#ff2bd6,#00e5ff);box-shadow:0 0 10px #00e5ff;transition:width .4s}
#stats{font-size:12px;margin-top:6px;color:#8fb7d8;line-height:1.5}
#votes{right:16px;top:14px;width:300px}
#votes h2{margin:0 0 6px;font-size:13px;letter-spacing:3px;color:#ff2bd6}
.vrow{display:flex;align-items:center;gap:8px;margin:5px 0;cursor:pointer;user-select:none}
.vrow .k{width:74px;font-size:13px;font-weight:700;letter-spacing:1px;color:#00e5ff}
.vrow .b{flex:1;height:16px;background:#12102a;border:1px solid #243;position:relative}
.vrow .b i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#7a1fff,#ff2bd6);box-shadow:0 0 10px #ff2bd6;transition:width .25s}
.vrow .n{width:30px;text-align:right;font-size:13px}
.vrow:hover .k{color:#fff}
#timer{margin-top:8px}#timer .bar{height:12px}
#timer .bar>i{background:linear-gradient(90deg,#00e5ff,#39ff88);transition:none}
#tleft{display:flex;justify-content:space-between;font-size:12px;color:#8fb7d8;margin-top:4px}
#help{margin-top:8px;font-size:11px;color:#6f8aa8;line-height:1.5}
#bottom{left:16px;bottom:14px;display:flex;gap:14px;align-items:flex-end}
#mini{width:190px;height:190px;background:rgba(0,0,0,.35);border:1px solid rgba(0,229,255,.3);display:block}
#evbox{right:16px;bottom:14px;width:300px;font-size:12px}
#evbox .big{font-size:22px;letter-spacing:2px;color:#ffe600}
#shield{margin-top:6px;letter-spacing:2px}
#top{margin-top:8px;color:#8fb7d8;line-height:1.5}
#feed{margin-top:8px;color:#6f8aa8;max-height:90px;overflow:hidden;line-height:1.4}
#banner{position:fixed;left:50%;top:9%;transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .3s}
#banner.show{opacity:1;animation:glitch .25s steps(2) 6}
#banner h1{margin:0;font-size:min(6vw,64px);letter-spacing:10px;color:#ff2bd6}
#banner p{margin:6px 0 0;font-size:min(3vw,26px);letter-spacing:4px;color:#00e5ff}
@keyframes glitch{0%{transform:translateX(-50%) skewX(0)}25%{transform:translateX(calc(-50% + 8px)) skewX(8deg);filter:hue-rotate(60deg)}50%{transform:translateX(calc(-50% - 10px));filter:hue-rotate(-60deg)}100%{transform:translateX(-50%)}}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:#f00;mix-blend-mode:screen}
#scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
#win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle,rgba(255,230,0,.25),rgba(5,4,12,.85));text-align:center}
#win h1{font-size:min(12vw,130px);margin:0;letter-spacing:12px;color:#ffe600}
#win p{font-size:min(3vw,28px);letter-spacing:4px;color:#00e5ff}
#conn{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);font-size:11px;color:#6f8aa8}
#freeze{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%);display:none;font-size:38px;letter-spacing:8px;color:#9fe8ff}
body.lite .panel{backdrop-filter:none;box-shadow:none;background:rgba(8,6,22,.8)}body.lite #scan{display:none}body.lite .neon{text-shadow:none}body.lite #flash{mix-blend-mode:normal}
</style></head><body>
<canvas id="gl"></canvas><div id="scan"></div><div id="flash"></div>
<div class="panel" id="title"><h1 class="neon">NEON ASCENT</h1><div class="sub">CHAT CONTROLS THE RUNNER</div>
 <div id="zone" class="neon">—</div><div class="bar"><i id="prog"></i></div><div id="stats"></div></div>
<div class="panel" id="votes"><h2 class="neon">VOTING</h2>
 <div id="vrows"></div>
 <div id="timer"><div class="bar"><i id="tbar"></i></div><div id="tleft"><span id="tsec">—</span><span id="tn">0 votes</span></div></div>
 <div id="help">Type in chat:<br><b>!up !down !left !right !wait</b><br>(or !w !s !a !d !x) — the most common command wins</div></div>
<div id="bottom"><canvas id="mini" width="190" height="190"></canvas></div>
<div class="panel" id="evbox"><div>NEXT EVENT</div><div class="big neon" id="evt">--:--</div>
 <div id="shield"></div><div id="top"></div><div id="feed"></div></div>
<div id="banner"><h1 class="neon" id="bt"></h1><p id="bd"></p></div>
<div id="freeze" class="neon"></div>
<div id="win"><h1 class="neon">YOU WIN!</h1><p id="wstat"></p><p id="wreset"></p></div>
<div id="conn">connecting…</div>
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/chatgame/client.js"></script>
</body></html>
