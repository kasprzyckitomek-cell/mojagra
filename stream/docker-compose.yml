services:
  neon-stream:
    build: .
    container_name: neon-stream
    restart: unless-stopped
    env_file: .env
    shm_size: "1gb"
    volumes:
      - ./music:/music:ro      # optional: put .mp3 files here for background music
    devices: ["/dev/dri:/dev/dri"]   # Intel UHD 770 (needed only for ENCODER=vaapi)
